<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peta Dunia — Keadaan Dunia Real-Time</title>
<link rel="stylesheet" href="css/maplibre-gl.css">
<link rel="stylesheet" href="css/gaya.css?v=20261008-3">
</head>
<body>

<div id="peta"></div>

<header id="bilah-atas">
  <div class="merek">
    <span class="bola"></span>
    <b>PETA DUNIA</b>
    <span class="kecil">keadaan dunia real-time</span>
  </div>
  <div class="kanan">
    <span id="jam" class="jam">--:--:--</span>
    <button id="tombol-globe" class="tombol-kecil" title="Ganti globe / datar">🌐 Globe</button>
    <button id="tombol-gaya" class="tombol-kecil" title="Ganti satelit / peta">🛰️ Satelit</button>
    <button id="tombol-panel" class="tombol-kecil hanya-hp" title="Kategori">☰</button>
  </div>
</header>

<aside id="panel-kategori">
  <div class="judul-panel">
    <b>KATEGORI</b>
    <span id="jumlah-aktif" class="lencana">0</span>
  </div>
  <div id="daftar-kategori"></div>
  <div class="kaki-panel">
    <button id="tombol-semua-mati" class="tombol-lebar">Matikan semua</button>
    <div id="status-data" class="status">siap</div>
  </div>
</aside>

<div id="panel-info" class="sembunyi">
  <button id="tutup-info" class="tutup">×</button>
  <div id="isi-info"></div>
</div>

<div id="keterangan-peta" class="keterangan"></div>

<div id="pita-skala" class="sembunyi"></div>

<script src="js/lib/maplibre-gl.js"></script>
<script src="js/inti.js?v=20261008-1"></script>
<script src="js/lapisan/alat.js?v=20261008-1"></script>
<script src="js/cari.js?v=20261008-1"></script>
<script src="js/lapisan/gempa.js?v=20261006-8"></script>
<script src="js/lapisan/kebakaran.js?v=20261008-1"></script>
<script src="js/lapisan/gunung.js?v=20261006-8"></script>
<script src="js/lapisan/angin.js?v=20261007-5"></script>
<script src="js/lapisan/hujan.js?v=20261007-4"></script>
<script src="js/lapisan/penerbangan.js?v=20261007-13"></script>
<script src="js/lapisan/suhu.js?v=20261008-1"></script>
<script src="js/lapisan/awan.js?v=20261008-1"></script>
</body>
</html>
